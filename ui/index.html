<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日幸福时刻</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./styles.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-md">
        <!-- 主要内容区域 -->
        <main>
            <!-- 事件显示区域 -->
            <div class="bg-white rounded-3xl shadow-sm p-8 mb-6">
                <h1 class="text-xl font-medium text-center text-gray-800 mb-8">今日幸福时刻</h1>
                
                <!-- 图标和事件描述 -->
                <div class="flex flex-col items-center mb-8">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mb-6">
                        <svg class="w-10 h-10 text-blue-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                        </svg>
                    </div>
                    <p class="text-lg text-center text-gray-700 mb-6">听一首让你感动的音乐</p>
                    
                    <!-- 添加图片展示 -->
                    <div class="w-full aspect-w-16 aspect-h-9 rounded-2xl overflow-hidden mb-6">
                        <img src="https://picsum.photos/400/300" alt="事件图片" class="w-full h-full object-cover">
                    </div>
                </div>

                <!-- 进度显示 -->
                <p class="text-sm text-center text-gray-500">已生成 1/15 个幸福时刻</p>
            </div>

            <!-- 按钮区域 -->
            <div class="space-y-4">
                <button class="w-full bg-gradient-to-r from-blue-500 to-purple-500 text-white font-medium py-4 px-6 rounded-2xl transition duration-300">
                    换一个幸福时刻
                </button>
                
                <div class="grid grid-cols-2 gap-4">
                    <a href="./history.html" class="text-gray-600 text-center text-sm">
                        查看历史记录
                    </a>
                    <button class="text-gray-600 text-center text-sm">
                        重置列表
                    </button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
